<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reservas · Fazenda Curió</title>
  <link rel="stylesheet" href="/campanhas/style.css">
  <link rel="stylesheet" href="/reservar/style.css">
  <script type="module" src="/reservar/app.js"></script>
</head>
<body class="public-reservations">
  <header class="reservation-header">
    <a href="/" class="brand"><img class="logo" src="/logo.jpg" alt=""><span>Fazenda Curió</span></a>
  </header>
  <main class="workspace">
    <h1>Reserve sua data</h1>
    <p id="status" role="status">Carregando…</p>
    <section id="access" class="card" aria-labelledby="access-title">
      <h2 id="access-title">Acesse sua reserva</h2>
      <form id="login">
        <div class="reservation-form">
          <label>CPF <input name="cpf" inputmode="numeric" maxlength="14" required></label>
          <label>Data de nascimento <input name="birth_date" type="date" autocomplete="bday" required></label>
          <button id="access-button" class="primary" type="submit">Continuar</button>
        </div>
        <fieldset id="registration-fields" hidden disabled>
          <legend>Complete seu cadastro</legend>
          <div class="reservation-form">
            <label>Nome completo <input name="name" autocomplete="name" maxlength="120" required></label>
            <label>WhatsApp com DDD <input name="phone" type="tel" autocomplete="tel" maxlength="24" required></label>
            <label>Cidade <input name="city" autocomplete="address-level2" maxlength="100"></label>
            <label>UF <input name="state" autocomplete="address-level1" maxlength="40"></label>
          </div>
        </fieldset>
      </form>
    </section>
    <section class="card">
      <h2>Datas disponíveis</h2>
      <div id="calendar" aria-label="Calendário mensal de disponibilidade"></div>
      <p id="selected-date" role="status"></p>
      <form id="request-form"><button id="request-button" type="submit" hidden>Enviar intenção de reserva</button></form>
    </section>
    <section id="account" class="card" hidden>
      <h2>Meu cadastro</h2>
      <form id="profile-form" class="reservation-form">
        <label>Nome <input name="name" autocomplete="name" maxlength="120" required></label>
        <label>WhatsApp <input name="phone" type="tel" autocomplete="tel" maxlength="24"></label>
        <label>Cidade <input name="city" autocomplete="address-level2" maxlength="100"></label>
        <label>UF <input name="state" autocomplete="address-level1" maxlength="40"></label>
        <button type="submit">Salvar dados</button>
      </form>
      <button id="logout" class="secondary" type="button">Sair do cadastro</button>
      <h2>Minhas solicitações</h2>
      <ul id="requests" class="reservation-list"></ul>
    </section>
  </main>
</body>
</html>
