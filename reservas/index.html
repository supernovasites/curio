<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clientes e reservas · Fazenda Curió</title>
  <link rel="stylesheet" href="/campanhas/style.css">
  <link rel="stylesheet" href="/reservar/style.css">
  <script type="module" src="/reservarquarto/app.js"></script>
</head>
<body>
  <header class="app-header" hidden></header>
  <main class="workspace">
    <p id="status" role="status">Carregando…</p>
    <section id="signin" class="card" hidden>
      <h1>Entre na plataforma</h1>
      <form id="login" class="reservation-form">
        <label>Usuário <input name="username" autocomplete="username" required></label>
        <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
      </form>
    </section>
    <section id="customers" hidden>
      <h1>Clientes</h1>
      <section class="card">
        <h2>Cadastrar cliente</h2>
        <form id="customer-form" class="reservation-form"></form>
      </section>
      <section class="card">
        <h2>Clientes cadastrados</h2>
        <form id="customer-search" class="reservation-form">
          <label>Buscar por nome <input name="q" type="search"></label>
          <label>Cadastro a partir de <input name="registeredFrom" type="date"></label>
          <label>Cadastro até <input name="registeredTo" type="date"></label>
          <label>Nascimento a partir de <input name="birthFrom" type="date"></label>
          <label>Nascimento até <input name="birthTo" type="date"></label>
          <button class="secondary" type="submit">Filtrar</button>
          <button class="secondary" type="reset">Limpar filtros</button>
        </form>
        <ul id="customer-list" class="reservation-list"></ul><div id="customer-pages" class="pagination"></div>
      </section>
    </section>
    <section id="reservations" hidden>
      <h1>Gestão de reservas</h1>
      <p><a href="/reservas/">Abrir página de reservas dos clientes</a></p>
      <section class="card">
        <h2>Selecionar cliente</h2>
        <form id="reservation-search" class="reservation-form">
          <label>Buscar cliente por nome <input name="q" type="search"></label>
          <button class="secondary" type="submit">Buscar cliente</button>
        </form>
        <div id="reservation-pages" class="pagination"></div>
        <form id="new-reservation" class="reservation-form">
          <label>Cliente <select name="customerId" required></select></label>
          <input name="day" type="hidden">
        </form>
      </section>
      <section class="card">
        <h2>Disponibilidade do mês</h2><div id="calendar" aria-label="Calendário mensal de gestão"></div><p id="selected-date" role="status"></p>
        <form id="date-form" class="reservation-form">
          <input name="day" type="hidden">
          <button type="submit" value="open">Disponibilizar fim de semana</button>
          <button type="submit" value="close" class="secondary">Bloquear fim de semana</button>
        </form>
        <button id="register-intent" class="primary" type="submit" form="new-reservation" disabled>Registrar intenção</button>
      </section>
      <section class="card">
        <h2>Solicitações e reservas</h2>
        <ul id="reservation-list" class="reservation-list"></ul>
      </section>
    </section>
  </main>
</body>
</html>
